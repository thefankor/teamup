services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_DB: teamup_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teamup_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    env_file:
      - ./backend/.env.test
    environment:
      POSTGRES_HOST: test-db
      POSTGRES_PORT: 5432
    depends_on:
      test-db:
        condition: service_healthy
    command: python -m pytest -m "unit or integration or e2e" --cov=src --cov-config=.coveragerc --cov-report=term-missing

  frontend-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    env_file:
      - ./frontend/.env.test
    command: npm run test -- --coverage
