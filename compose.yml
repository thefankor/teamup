services:
  db:
    container_name: teamup-db
    image: postgres:17
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - teamup_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - teamup-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: teamup-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_HOST: ${S3_PUBLIC_HOST:-http://localhost:9000}
      POSTGRES_HOST: db
      REDIS_HOST: redis
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "8888:8000"
    networks:
      - teamup-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:alpine
    container_name: teamup-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - teamup_redis_data:/data
    env_file:
      - .env
    networks:
      - teamup-network
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$REDIS_PASSWORD\" ]; then redis-cli -a \"$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 20
    command:
      - sh
      - -c
      - >
        if [ -n "$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes --save 60 1 --maxmemory 1024mb --maxmemory-policy allkeys-lru;
        else
          exec redis-server --appendonly yes --save 60 1 --maxmemory 1024mb --maxmemory-policy allkeys-lru;
        fi

  celery_worker:
    container_name: teamup-celery-worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_HOST: ${S3_PUBLIC_HOST:-http://localhost:9000}
    networks:
      - teamup-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A src.tasks.celery_app worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.tasks.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    container_name: teamup-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: always
    ports:
      - "3333:80"
    networks:
      - teamup-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: teamup-minio
    restart: always
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - teamup_minio_data:/data
    networks:
      - teamup-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  teamup_db_data:
  teamup_redis_data:
  teamup_minio_data:

networks:
  teamup-network:
    driver: bridge
